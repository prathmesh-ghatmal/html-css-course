 <!DOCTYPE html>
<html>
    <head>
        <title>Exercise 10</title>
        <style>
            .profile-card {
                display: flex;
                align-items: center; 
                padding: 10px;
                width: 300px;
            }

            .cat {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                object-fit: cover;
                margin-right: 10px;
            }

            .text {
                flex: 1;
            }

            .name {
                font-weight: bold;
                font-size: 18px;
            }

            .description {
              
                font-size: 14px;
                margin-top: 2px;
            }

            .status {

                font-size: 12px;
                margin-top: 2px;
            }
            .button{
                width: 80px;
                height: 40px;
                border: none;
                border-radius: 5px;
                color: white;
                background-color: rgb(22, 118, 192);
            }
        </style>
    </head>
    <body>
        <div class="profile-card"> 
            <img class="cat" src="imgs/cat.png"> 
            <div class="text">
                <div class="name">Oliver</div>
                <div class="description">the cat</div>
                <div class="status">Popular</div>
            </div>
             <button class="button">Follow</button>
        </div>
        </div>
    </body>
</html>
