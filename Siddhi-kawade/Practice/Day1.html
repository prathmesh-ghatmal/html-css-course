<!DOCTYPE html>
<html>
<head>
  <title>Day 1</title>
  <style>
    body {
      background: #c6ccd9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 500px;
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      width: 280px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
    }

    h1 {
      font-size: 20px;
      margin: 10px 0 5px;
    }

    h3 {
      font-size: 14px;
      color: gray;
      margin-bottom: 10px;
    }

    .para {
      font-size: 13px;
      color: #555;
    }

    .button {
      color: white;
      background-color: rgb(23, 113, 215);
      border-radius: 6px;
      border: none;
      padding: 6px 10px;
      margin: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    hr {
      margin: 15px 0;
      border: 0.5px solid #ddd;
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    .social img {
      width: 22px;
      height: 22px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <img class="img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxctjU21pUENIsGN1F4qY21P7GfdEbhTMp2g&s" alt="profile img">

    <h1>Siddhi Kawade</h1>
    <h3>Web Developer</h3>

    <hr>

    <p class="para">
      Passionate about coding and building awesome websites.
      Love to learn and create!
    </p>

    <hr>

    <button class="button">Follow</button>
    <button class="button">Message</button>
    <button class="button">Contact</button>

    <hr>

    <div class="social">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384031.png" alt="Facebook">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384032.png" alt="Twitter">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384033.png" alt="Instagram">
    </div>
  </div>
</body>
</html>
