<!DOCTYPE html>
<html>
<head>
  <title>Day 5</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    .footer {
      max-width: full;
      margin-top: 1000px;
      background: linear-gradient(135deg, #1f2937, #374151);
      color: #d1d5db;
      padding: 40px;
      /* border-radius: 14px; */
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
      flex-wrap: wrap;
    }

    h3 {
      color: #fff;
      margin-bottom: 10px;
      font-size: 16px;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    ul li {
      margin-bottom: 8px;
      cursor: pointer;
    }

    ul li:hover {
      color: white;
    }

    .logo {
      max-width: 260px;
    }

    .logo img {
      width: 120px;
      margin-bottom: 15px;
    }

    .social-icons img {
      width: 28px;
      height: 28px;
      margin-right: 8px;
    }

    .subscribe input {
      padding: 10px;
      width: 180px;
      border-radius: 6px;
      border: none;
      margin-right: 8px;
    }

    .subscribe button {
      padding: 10px 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .subscribe button:hover {
      background: #2563eb;
    }

    .footer-bottom {
      width: full;
      /* border-top: 1px solid #4b5563;
      margin-top: 30px;
      /* padding-top: 15px; */
      /* text-align: center; */
      /* font-size: 13px; */ 
    }
  </style>
</head>

<body>
  <footer class="footer">
    <div class="footer-top">

      <div class="logo">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZ6OMjjsAy_YiUgp2pn6Mdnws_lV8GpD451g&s">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>

        <div class="social-icons">
          <img src="https://cdn-icons-png.flaticon.com/512/1384/1384031.png">
          <img src="https://cdn-icons-png.flaticon.com/512/1384/1384032.png">
          <img src="https://cdn-icons-png.flaticon.com/512/1384/1384033.png">
        </div>
      </div>

      <div>
        <h3>Company</h3>
        <ul>
          <li>About Us</li>
          <li>Careers</li>
          <li>Blog</li>
          <li>Press</li>
          <li>Contact Us</li>
        </ul>
      </div>

      <div>
        <h3>Resources</h3>
        <ul>
          <li>Help Center</li>
          <li>Guides</li>
          <li>FAQs</li>
          <li>Support</li>
          <li>Privacy Policy</li>
        </ul>
      </div>

      <div class="subscribe">
        <h3>Subscribe</h3>
        <p>Subscribe to our newsletter</p>
        <input type="email" placeholder="Enter your email">
        <button>Subscribe</button>
      </div>

    </div>

    <div class="footer-bottom">
      © 2024 Your Company. All rights reserved.
    </div>
  </footer>
</body>
</html>
