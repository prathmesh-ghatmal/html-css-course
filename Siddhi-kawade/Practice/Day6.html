<!DOCTYPE html>
<html>
<head>
  <title>Day6</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f9ff;
    }

    .hero {
      max-width: 1400px;
      margin: 30px auto;
      height: 520px;
      border-radius: 20px;
      overflow: hidden;

      /* background image */
      background: url("backdrop.png") no-repeat center;
      background-size: cover;

      display: flex;
      align-items: center;
      padding-left: 80px;
    }

    .hero-content {
      max-width: 520px;
    }

    .hero-content h1 {
      font-size: clamp(30px, 4vw, 44px);
      color: #1f2a44;
      line-height: 1.3;
      margin-bottom: 20px;
    }

    .hero-content h1 span {
      color: #0d8bff;
    }

    .hero-content p {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
      max-width: 420px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: #0d8bff;
      color: white;
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-secondary {
      background: white;
      color: #0d8bff;
      padding: 12px 28px;
      border-radius: 8px;
      border: 1px solid #0d8bff;
      cursor: pointer;
      font-size: 15px;
    }

    .stats {
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 14px;
      color: #374151;
    }

    .stats span {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stats span::before {
      content: "✔";
      background: #0d8bff;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="hero-content">
      <h1>
        Empower Your Business<br>
        with <span>Innovative Solutions</span>
      </h1>

      <p>
        Leveraging cutting-edge technology to drive
        success and help grow your business
      </p>

      <div class="buttons">
        <button class="btn-primary">Get Started</button>
        <button class="btn-secondary">Watch Demo</button>
      </div>

      <div class="stats">
        <span>1200+ Clients Served</span>
        <span>99% Customer Satisfaction</span>
        <span>24/7 Support</span>
      </div>
    </div>
  </section>

</body>
</html>
