<!DOCTYPE html>
<html>
<head>
  <title>Profile </title>
  <style>
    body {
      background: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      width: 420px;
      padding: 25px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .profile {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    h2 {
      margin: 10px 0 5px;
      font-size: 24px;
    }

    h4 {
      margin: 0;
      color: gray;
      font-weight: normal;
    }

    p {
      font-size: 14px;
      color: #555;
      margin: 18px 0;
      line-height: 1.6;
    }

    hr {
      border: none;
      height: 1px;
      background: #e5e7eb;
      margin: 18px 0;
    }

    .buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 10px;
    }

    .btn {
      width: 110px;
      padding: 10px 0;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 14px;
      font-weight: 500;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #2563eb;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #3b82f6;
      color: white;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #2563eb;
    }

    .social {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 18px;
    }

    .social img {
      width: 22px;
      height: 22px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">
    <img class="profile" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="profile">
    <h2>John Doe</h2>
    <h4>Web Developer</h4>
    <hr>

    <p>
      Passionate about coding and building awesome websites.
      Love to learn and create!
    </p>
    <hr>

    <div class="buttons">
      <button>Follow</button>
      <button>Message</button>
      <button>Contact</button>
    </div>

    <hr>

    <div class="social">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384031.png" alt="Facebook">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384032.png" alt="Twitter">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384033.png" alt="Instagram">
    </div>
  </div>

</body>
</html>
